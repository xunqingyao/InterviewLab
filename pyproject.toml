[project]
name = "interviewlab"
version = "0.1.0"
description = "Multi-agent mock interview and training system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.17",
  "pypdf>=5.1.0",
  "jieba>=0.42.1",
  "pgvector>=0.3.6",
  "langgraph>=0.2.60",
  "langchain-core>=0.3.28",
  "langgraph-checkpoint-postgres>=2.0.0",
  "structlog>=24.4.0",
  "orjson>=3.10.0",
  "email-validator>=2.2.0",
  "psycopg[binary]>=3.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["packages", "apps"]
include = ["domain*", "db*", "agents*", "llm_gateway*", "retrieval*", "documents*", "observability*", "api*", "worker*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "packages", "apps"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["packages", "apps", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
